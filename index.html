<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="Spencer Delcore - Graduate Student & Machine Learning Developer">
    <meta name="author" content="Spencer Delcore">
    <title>Spencer Delcore - Portfolio</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="img/favicon.svg" type="image/svg+xml">
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a1f2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            z-index: 1;
            padding: 2rem;
        }
        
        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #0f4c5c 0%, #5a9ca8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeIn 0.8s ease-out;
        }
        
        h3 {
            font-size: 1.25rem;
            font-weight: 300;
            color: #94a3b8;
            margin-bottom: 3rem;
            line-height: 1.6;
            animation: fadeIn 1s ease-out 0.2s both;
        }
        
        .social-links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            animation: fadeIn 1s ease-out 0.4s both;
        }
        
        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.875rem 2rem;
            background: rgba(90, 156, 168, 0.1);
            border: 1px solid rgba(90, 156, 168, 0.2);
            border-radius: 50px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .social-link:hover {
            background: rgba(90, 156, 168, 0.2);
            border-color: rgba(90, 156, 168, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(90, 156, 168, 0.5);
        }
        
        /* Background animation */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a1f2e 0%, #1a3a52 100%);
            z-index: -2;
        }
        
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            z-index: -1;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.1) 35px, rgba(255,255,255,.1) 70px);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            h3 {
                font-size: 1.1rem;
            }
            
            .social-links {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }
            
            .social-link {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-pattern"></div>
    
    <div class="container">
        <h1>Spencer Delcore</h1>
        <h3>Graduate Student @ UWaterloo<br>Machine Learning Developer @ Molex</h3>
        <div class="social-links">
            <a href="https://github.com/sdelcore" class="social-link">GitHub</a>
            <a href="https://ca.linkedin.com/in/spencer-delcore-105701b6" class="social-link">LinkedIn</a>
        </div>
    </div>
</body>
</html>
